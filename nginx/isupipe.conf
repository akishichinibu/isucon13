# Dual TLS edges (.214 and .216) proxy to the single rust process on .215:8080.
upstream isupipe {
  server 192.168.0.215:8080;
  keepalive 256;
}

server {
  listen 80 default_server;
  server_name _;
  access_log off;
  error_log /dev/null emerg;
  root /var/www/html;
  location / { try_files $uri $uri/ =404; }
}

server {
  listen 443 ssl http2 default_server;
  server_name _;
  access_log off;
  error_log /dev/null emerg;
  ssl_certificate     /etc/nginx/tls/_.t.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.t.isucon.dev.key;
  ssl_protocols TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  root /var/www/html;
  location / { try_files $uri $uri/ =404; }
}

server {
  listen 443 ssl http2;
  server_name u.isucon.dev;
  server_name *.u.isucon.dev;
  access_log off;
  error_log /dev/null emerg;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.dev.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  client_max_body_size 10m;
  root /home/isucon/webapp/public/;

  location / {
    try_files $uri /index.html;
  }

  location /api {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header If-None-Match $http_if_none_match;
    proxy_pass http://isupipe;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
  }
}
