api=yes
api-key=isudns
webserver=yes
webserver-address=127.0.0.1
webserver-allow-from=127.0.0.1,::1
include-dir=/etc/powerdns/pdns.d
launch=gmysql
gmysql-port=3306
gmysql-user=isudns
gmysql-dbname=isudns
gmysql-password=isudns
local-port=53
security-poll-suffix=
setgid=pdns
setuid=pdns

# Packet cache / query cache. Record TTL is 30s so packet cache can store answers.
# NXDOMAIN for unique water-torture names still hits the backend; nametype_index keeps that cheap.
cache-ttl=60
negquery-cache-ttl=60
query-cache-ttl=20
zone-cache-refresh-interval=60
zone-metadata-cache-ttl=60

receiver-threads=2
distributor-threads=4

log-dns-queries=no
loglevel=3
log-dns-details=no
